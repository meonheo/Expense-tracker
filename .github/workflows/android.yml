# =========================================================
# Build APK mỗi lần có code mới trên nhánh main
# → đăng lên trang Releases của repo để tải về điện thoại
# =========================================================
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Lấy code
        uses: actions/checkout@v5

      - name: Cài Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Dùng SDK có sẵn trên máy build; thiếu thì tự tải công cụ dòng lệnh của Google
      - name: Cài Android SDK + Android 16 (API 36)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          echo "SDK: $SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            mkdir -p "$SDK/cmdline-tools"
            for v in 13114758 11076708; do
              curl -fsSLo /tmp/clt.zip "https://dl.google.com/android/repository/commandlinetools-linux-${v}_latest.zip" && break
            done
            rm -rf "$SDK/cmdline-tools/latest" "$SDK/cmdline-tools/cmdline-tools"
            unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Đặt tên file
        run: cp android/app/build/outputs/apk/release/app-release.apk "ExpenseTracker-v1.0.${{ github.run_number }}.apk"

      - name: Đăng lên Releases
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" "ExpenseTracker-$TAG.apk" \
            --title "Expense tracker $TAG" \
            --notes "${NOTES:-Bản build thủ công}" \
            --latest
